name: HowTo CI

# The upstream "Push" workflow only runs for pull requests against develop. The HowTo.Software
# fork is based on the v1.13.4 tag, so it needs its own build/test pipeline.
on:
  push:
    branches:
      - "howto/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - "howto/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (linux/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          SRC_PATH: github.com/pterodactyl/wings
        run: |
          go build -v -trimpath -ldflags="-s -w -X ${SRC_PATH}/system.Version=v1.13.4-howto.${GITHUB_SHA:0:7}" -o dist/wings ${SRC_PATH}
          chmod 755 dist/wings
          (cd dist && sha256sum wings > wings.sha256)

      - name: go vet
        if: ${{ matrix.goarch == 'amd64' }}
        run: go vet ./...

      - name: go test
        if: ${{ matrix.goarch == 'amd64' }}
        env:
          CGO_ENABLED: 0
        run: go test $(go list ./...)

      - name: go test -race
        if: ${{ matrix.goarch == 'amd64' }}
        env:
          CGO_ENABLED: 1
        run: go test -race $(go list ./...)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wings-howto_linux_${{ matrix.goarch }}
          path: dist/
